<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANU — AI Voice Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated gradient mesh background -->
  <div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
  </div>

  <!-- Noise overlay -->
  <div class="noise-overlay"></div>

  <!-- Main container -->
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" stroke="url(#lg1)" stroke-width="2" opacity="0.6"/>
            <circle cx="20" cy="20" r="10" stroke="url(#lg1)" stroke-width="1.5" opacity="0.4"/>
            <circle cx="20" cy="20" r="4" fill="url(#lg1)"/>
            <defs>
              <linearGradient id="lg1" x1="0" y1="0" x2="40" y2="40">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#60a5fa"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          <h1>MANU</h1>
          <span class="logo-sub">AI Voice Studio</span>
        </div>
      </div>
      <div class="header-status">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-label" id="statusLabel">Offline</span>
      </div>
    </header>

    <!-- Two-panel layout -->
    <main class="panels">

      <!-- API KEY PANEL -->
      <section class="glass-card card-api">
        <div class="card-shine"></div>
        <div class="card-inner">
          <div class="card-header">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
              </svg>
            </div>
            <div>
              <h2 class="card-title">API Configuration</h2>
              <p class="card-desc">Paste your secret key to connect</p>
            </div>
          </div>

          <div class="api-input-group">
            <div class="input-mirror">
              <input
                type="password"
                id="apiKeyInput"
                class="glass-input"
                placeholder="sk-••••••••••••••••••••••••"
                autocomplete="off"
                spellcheck="false"
              />
              <button class="btn-icon btn-toggle" id="toggleVisibility" title="Show / Hide">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
              <button class="btn-icon btn-paste" id="pasteBtn" title="Paste from clipboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="api-actions">
            <button class="btn-glass btn-save" id="saveKeyBtn">
              <span class="btn-shimmer"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              <span>Save Key</span>
            </button>
            <button class="btn-glass btn-clear" id="clearKeyBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <span>Clear</span>
            </button>
          </div>

          <div class="api-status" id="apiStatus">
            <div class="api-status-icon"></div>
            <span>No key saved</span>
          </div>
        </div>
      </section>

      <!-- RECORDER PANEL -->
      <section class="glass-card card-recorder">
        <div class="card-shine"></div>
        <div class="card-inner">
          <div class="card-header">
            <div class="card-icon card-icon-rec">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </div>
            <div>
              <h2 class="card-title">Voice Recorder</h2>
              <p class="card-desc">Tap to capture your voice</p>
            </div>
          </div>

          <!-- Visualizer ring -->
          <div class="recorder-vis-wrapper">
            <div class="vis-ring" id="visRing">
              <div class="vis-glow"></div>
              <canvas id="visCanvas" width="220" height="220"></canvas>
              <div class="vis-center">
                <button class="rec-button" id="recBtn" title="Record">
                  <div class="rec-icon" id="recIcon">
                    <svg class="mic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                      <line x1="12" y1="19" x2="12" y2="23"/>
                      <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                    <div class="stop-square" style="display:none"></div>
                  </div>
                </button>
              </div>
            </div>
            <div class="timer" id="timer">00:00</div>
          </div>

          <!-- Recorder Controls -->
          <div class="rec-controls">
            <button class="btn-glass btn-pause" id="pauseBtn" disabled title="Pause">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="4" width="4" height="16"/>
                <rect x="14" y="4" width="4" height="16"/>
              </svg>
              <span>Pause</span>
            </button>
          </div>

          <!-- Playback -->
          <div class="playback-section" id="playbackSection" style="display:none">
            <div class="playback-glass">
              <audio id="audioPlayback" controls></audio>
              <a class="btn-glass btn-download" id="downloadBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>Download</span>
              </a>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Built by <strong>Pruthvi</strong></span>
      <span class="dot">·</span>
      <span>MANU v1.0</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
